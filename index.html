<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelería AR | Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CATÁLOGO DE VIDRIOS</h1>
        <p>Selecciona un material para previsualizar</p>
    </header>

    <main class="grid-catalogo">
        <div class="card" onclick="activarCamara('claro')">
            <div class="preview claro"></div>
            <h3>Vidrio Claro</h3>
        </div>
        <div class="card" onclick="activarCamara('esmerilado')">
            <div class="preview esmerilado"></div>
            <h3>Esmerilado</h3>
        </div>
        <div class="card" onclick="activarCamara('filtrasol')">
            <div class="preview filtrasol"></div>
            <h3>Filtrasol Gris</h3>
        </div>
        <div class="card" onclick="activarCamara('reflecta')">
            <div class="preview reflecta"></div>
            <h3>Reflecta Plata</h3>
        </div>
    </main>

    <div id="visor-ar" class="oculto">
        <video id="video-feed" autoplay playsinline></video>
        <div id="filtro-vidrio"></div>
        <button class="btn-cerrar" onclick="cerrarCamara()">VOLVER AL CATÁLOGO</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
    <h1>Catálogo Interactivo</h1>
    <p>Selecciona un cristal para visualizarlo en tu entorno</p>
</div>

<div class="catalog" id="catalog">
    <div class="glass-card" data-effect="efecto-claro">Claro (Incoloro)</div>
    <div class="glass-card" data-effect="efecto-esmerilado">Esmerilado</div>
    <div class="glass-card" data-effect="efecto-filtrasol">Filtrasol</div>
    <div class="glass-card" data-effect="efecto-tintex">Tintex Verde</div>
    <div class="glass-card" data-effect="efecto-reflecta">Reflecta Plata</div>
</div>

<div class="camera-container" id="camera-container">
    <video id="camera-feed" autoplay playsinline></video>
    <div id="glass-overlay"></div>
    <div class="ui-controls">
        <button class="close-btn" id="close-btn">Cerrar Vista</button>
    </div>
</div>

<script>
    const catalogCards = document.querySelectorAll('.glass-card');
    const cameraContainer = document.getElementById('camera-container');
    const videoElement = document.getElementById('camera-feed');
    const glassOverlay = document.getElementById('glass-overlay');
    const closeBtn = document.getElementById('close-btn');
    let currentStream = null;

    async function startCamera() {
        try {
            const constraints = {
                video: { facingMode: 'environment' }
            };
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = currentStream;
        } catch (err) {
            alert("Se requiere acceso a la cámara y un entorno seguro (HTTPS) para esta función. Detalles: " + err.message);
            closeCamera();
        }
    }

    function closeCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        cameraContainer.style.display = 'none';
        glassOverlay.className = '';
        videoElement.srcObject = null;
    }

    catalogCards.forEach(card => {
        card.addEventListener('click', async () => {
            const effectClass = card.getAttribute('data-effect');
            glassOverlay.className = effectClass;
            cameraContainer.style.display = 'block';
            await startCamera();
        });
    });

    closeBtn.addEventListener('click', closeCamera);
</script>
</body>
</html>
