<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelería AR | Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CATÁLOGO DE VIDRIOS</h1>
        <p>Selecciona un material para previsualizar</p>
    </header>

    <main class="grid-catalogo">
        <div class="card" onclick="activarCamara('claro')">
            <div class="preview claro"></div>
            <h3>Vidrio Claro</h3>
        </div>
        <div class="card" onclick="activarCamara('esmerilado')">
            <div class="preview esmerilado"></div>
            <h3>Esmerilado</h3>
        </div>
        <div class="card" onclick="activarCamara('filtrasol')">
            <div class="preview filtrasol"></div>
            <h3>Filtrasol Gris</h3>
        </div>
        <div class="card" onclick="activarCamara('reflecta')">
            <div class="preview reflecta"></div>
            <h3>Reflecta Plata</h3>
        </div>
    </main>

    <div id="visor-ar" class="oculto">
        <video id="video-feed" autoplay playsinline></video>
        <div id="filtro-vidrio"></div>
        <button class="btn-cerrar" onclick="cerrarCamara()">VOLVER AL CATÁLOGO</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
